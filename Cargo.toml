[package]
name = "sysfun"
version = "0.1.0"
edition = "2021"
description = "Fast, elegant system-information TUI for Linux"
license = "MIT"
readme = "README.md"
rust-version = "1.87"
repository = "https://github.com/richvincent/sysfun"
keywords = ["tui", "system", "monitor", "wifi", "battery"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
